# Optional: a real PostgreSQL for production-like local runs. The default
# development setup needs nothing (the API embeds PostgreSQL via PGlite).
# Use it with: DATABASE_URL=postgres://b4:b4-local@localhost:5432/b4
# The API applies migrations itself on start.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: b4
      POSTGRES_USER: b4
      POSTGRES_PASSWORD: b4-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b4 -d b4"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
