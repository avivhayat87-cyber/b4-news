# Local infrastructure: PostgreSQL (schema loaded on first start) + Redis (Celery broker).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bifor
      POSTGRES_USER: bifor
      POSTGRES_PASSWORD: bifor-local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifor -d bifor"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
