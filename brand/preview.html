<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>B4 seal preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Rubik:wght@700;800&display=swap">
<style>
body{margin:0;font-family:Heebo,sans-serif;background:#fff;color:#121214}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:center;padding:14px 22px}
.dark{background:#121214}.red{background:#D9121F}
nav{background:#121214;display:flex;padding:0 16px}
nav a{color:#fff;font-weight:700;font-size:15px;padding:13px 14px 11px;border-bottom:4px solid transparent;text-decoration:none}
nav a.on{border-color:#D9121F;font-weight:800}
.h{display:flex;align-items:center;gap:10px;padding:16px 22px 6px}
.h h2{font-family:Rubik,Heebo,sans-serif;font-weight:800;font-size:30px;margin:0;line-height:1}
.rule{flex:1;height:2px;background:#121214}
.card{width:250px;display:flex;flex-direction:column;gap:8px}
.img{position:relative;aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#1C2836,#3E5773)}
.badge{position:absolute;bottom:10px;right:10px;width:40px;height:40px;border-radius:50%;background:#D9121F;color:#fff;font:800 20px Rubik,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}
.pill{position:absolute;top:10px;right:10px;background:#D9121F;color:#fff;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px}
h3{font-family:Rubik,Heebo,sans-serif;font-weight:700;font-size:17px;line-height:1.35;margin:0}
.lead{font-family:Rubik,Heebo,sans-serif;font-weight:800;font-size:44px;line-height:1.08;margin:0;max-width:16ch}
</style></head><body>
<div class="row"><img src="b4-logo.svg" width="200" alt=""><img src="b4-mark.svg" width="56" alt=""><img src="b4-icon.svg" width="56" alt=""><img src="b4-icon.svg" width="24" alt=""><img src="b4-mark.svg" width="16" alt=""></div>
<div class="row dark"><img src="b4-logo-dark.svg" width="170" alt=""></div>
<div class="row red"><img src="b4-logo-white.svg" width="170" alt=""></div>
<nav><a class="on" href="#">ראשי</a><a href="#">כלכלה ישראלית</a><a href="#">שוק ההון</a><a href="#">נדל״ן</a></nav>
<div class="h"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="#D9121F"/><path d="M13 5.5A7.5 7.5 0 1 0 19.5 9.25" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.75" cy="6.5" r="1.4" fill="#fff"/></svg><h2>חדשות חמות</h2><span class="rule"></span></div>
<div class="row" style="align-items:flex-start">
  <p class="lead">יוקר המחיה, הריבית והשכר: המדריך המלא</p>
  <div class="card"><div class="img"><span class="pill">שוק ההון</span><span class="badge">1</span></div><h3>חמש שאלות לפני שבוחרים קרן השתלמות</h3></div>
</div>
</body></html>
